<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>Ostfalia ISO</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  color: #111;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: #003d7a;
  color: white;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 5px solid #009ee0;
}
.hdr-left .uni  { font-size: 26px; font-weight: bold; letter-spacing: 1px; }
.hdr-left .dept { font-size: 15px; color: #aad4f5; margin-top: 2px; }
.stripes { display:flex; gap:4px; }
.stripes span { display:block; width:14px; height:44px; border-radius:3px; }
#state-bar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 24px; font-size: 20px; font-weight: bold;
  flex-shrink: 0; border-bottom: 2px solid #ddd;
}
#state-dot { width:16px; height:16px; border-radius:50%; flex-shrink:0; background:#009ee0; }
.s-idle     #state-bar { background:#e8f4ff; }
.s-idle     #state-dot { background:#009ee0; }
.s-idle     #state-text { color:#003d7a; }
.s-speaking #state-bar { background:#e8f8e8; }
.s-speaking #state-dot { background:#2d9b27; }
.s-speaking #state-text { color:#1a5c16; }
.s-listening #state-bar { background:#fff8e0; }
.s-listening #state-dot { background:#f7a800; }
.s-listening #state-text { color:#8a5c00; }
.s-thinking #state-bar { background:#f5eeff; }
.s-thinking #state-dot { background:#8844cc; }
.s-thinking #state-text { color:#5522aa; }
#prompt {
  text-align:center; padding:10px 20px 4px;
  font-size:18px; color:#445; flex-shrink:0;
}
#questions {
  flex:1; display:grid; grid-template-columns:1fr 1fr;
  gap:12px; padding:10px 18px; overflow:hidden;
}
.q-btn {
  display:flex; align-items:center; justify-content:center;
  text-align:center; background:#ffffff; border:3px solid #009ee0;
  border-radius:14px; color:#003d7a; font-size:18px; font-weight:bold;
  line-height:1.3; padding:16px 14px; text-decoration:none;
  cursor:pointer; min-height:80px;
}
.q-btn:active { background:#cce8ff; border-color:#0055bb; }
.q-btn.back {
  background:#f5f5f5; border-color:#aaa; color:#666;
  font-size:15px; grid-column:1/-1; min-height:52px;
}
.q-btn.end {
  background:#fff0f0; border-color:#cc3333; color:#cc3333;
  grid-column:1/-1; min-height:52px; font-size:16px; font-weight:bold;
}
.s-speaking #questions .q-btn,
.s-thinking #questions .q-btn { opacity:0.3; pointer-events:none; }
footer {
  text-align:center; padding:6px 16px 8px; font-size:13px; color:#778;
  flex-shrink:0; border-top:1px solid #ddd; background:#f8f8f8;
}
</style>
</head>
<body id="body" class="s-idle">

<header>
  <div class="hdr-left">
    <div class="uni">OSTFALIA</div>
    <div class="dept">International Student Office (ISO)</div>
  </div>
  <div class="stripes">
    <span style="background:#009ee0"></span>
    <span style="background:#00b894"></span>
    <span style="background:#f7a800"></span>
    <span style="background:#e84393"></span>
  </div>
</header>

<div id="state-bar">
  <div id="state-dot"></div>
  <span id="state-text">Welcome! Tap a question below to get started.</span>
</div>
<div id="prompt">What would you like to know?</div>
<div id="questions"></div>
<footer>incoming-iso@ostfalia.de &nbsp;·&nbsp; Véronique Bizien, Am Exer 2, Raum 008</footer>

<script>
var STATE_LABELS = {
  idle:      "Welcome! Tap a question below to get started.",
  speaking:  "Pepper is speaking — please wait ...",
  listening: "Listening — or tap a question below",
  thinking:  "Processing your question ..."
};
var PROMPTS = {
  idle: "What would you like to know?",
  listening: "Tap a question, or speak to Pepper:",
  speaking: "", thinking: ""
};

var currentState = "idle";
var currentQJson = "";
var body = document.getElementById("body");

function applyState(s) {
  if (s === currentState) return;
  currentState = s;
  body.className = "s-" + s;
  var el = document.getElementById("state-text");
  if (el) el.innerHTML = STATE_LABELS[s] || "";
  var pr = document.getElementById("prompt");
  if (pr) pr.innerHTML = PROMPTS[s] || "";
}

function sendTouch(q) {
  // Try XHR first (no page reload)
  try {
    var r = new XMLHttpRequest();
    r.open("GET", "/touch?q=" + encodeURIComponent(q), true);
    r.onerror = function() {
      window.location.href = "/touch?q=" + encodeURIComponent(q) + "&redirect=1";
    };
    r.send();
  } catch(e) {
    window.location.href = "/touch?q=" + encodeURIComponent(q) + "&redirect=1";
  }
}

function renderQuestions(questions) {
  var c = document.getElementById("questions");
  c.innerHTML = "";
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    var isBack = q.charAt(0) === "\u2190";
    var isEnd  = q.indexOf("Goodbye") > -1 || q.indexOf("goodbye") > -1 || q.charAt(0) === "\uD83D";
    var payload = isBack ? "__back__" : q;

    var el = document.createElement("a");
    el.href = "/touch?q=" + encodeURIComponent(payload) + "&redirect=1";
    el.className = "q-btn" + (isBack ? " back" : "") + (isEnd ? " end" : "");
    el.innerHTML = q;

    (function(elem, pay) {
      elem.onclick = function(e) {
        e.preventDefault();
        elem.style.background = isEnd ? "#ffcccc" : "#cce8ff";
        setTimeout(function() { elem.style.background = ""; }, 350);
        sendTouch(pay);
      };
    })(el, payload);

    c.appendChild(el);
  }
}

function xhrGet(url, cb) {
  try {
    var r = new XMLHttpRequest();
    r.open("GET", url, true);
    r.onreadystatechange = function() {
      if (r.readyState === 4 && r.status === 200) {
        try { cb(JSON.parse(r.responseText)); } catch(e) {}
      }
    };
    r.send();
  } catch(e) {}
}

function poll() {
  xhrGet("/api/state", function(d) { if (d.state) applyState(d.state); });
  xhrGet("/api/questions", function(d) {
    if (!d.questions) return;
    var j = JSON.stringify(d.questions);
    if (j !== currentQJson) { currentQJson = j; renderQuestions(d.questions); }
  });
}

// Initial render
renderQuestions([
  "What is the International Student Office?",
  "How do I apply for Erasmus?",
  "What language courses are available?",
  "How do I find housing?",
  "What health insurance do I need?",
  "How do I study abroad?",
  "👋 Goodbye / That\u2019s all, thank you!"
]);

setInterval(poll, 500);
poll();
</script>
</body>
</html>
