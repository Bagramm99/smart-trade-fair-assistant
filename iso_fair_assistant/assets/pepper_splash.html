<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISO Pepper Start</title>
<style>
:root {
  --bg1: #0f172a;
  --bg2: #132238;
  --panel: rgba(255, 255, 255, 0.08);
  --panel-border: rgba(255, 255, 255, 0.14);
  --text: #f8fafc;
  --muted: #b8c2d9;
  --accent: #00b8d9;
  --accent-2: #36d399;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 20% 20%, rgba(0, 184, 217, 0.24), transparent 28%),
    radial-gradient(circle at 80% 20%, rgba(54, 211, 153, 0.20), transparent 24%),
    linear-gradient(135deg, var(--bg1), var(--bg2));
  overflow: hidden;
}
main {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
}
.card {
  width: min(92vw, 720px);
  padding: 32px 28px;
  border-radius: 28px;
  border: 1px solid var(--panel-border);
  background: var(--panel);
  backdrop-filter: blur(18px);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
  text-align: center;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.10);
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-2);
  box-shadow: 0 0 18px var(--accent-2);
}
h1 {
  margin: 22px 0 12px;
  font-size: clamp(38px, 7vw, 68px);
  line-height: 0.95;
  letter-spacing: -0.04em;
}
p {
  margin: 0 auto;
  max-width: 540px;
  font-size: clamp(18px, 2.6vw, 24px);
  line-height: 1.55;
  color: var(--muted);
}
.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 28px;
}
button {
  appearance: none;
  border: 0;
  border-radius: 18px;
  padding: 18px 28px;
  min-width: 220px;
  font: inherit;
  font-size: 20px;
  font-weight: 800;
  color: #04111d;
  background: linear-gradient(135deg, #7de2ff, #36d399);
  cursor: pointer;
  box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
  transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
}
button:active {
  transform: scale(0.97);
  filter: brightness(0.94);
}
button[disabled] {
  opacity: 0.72;
  cursor: wait;
}
.hint {
  margin-top: 16px;
  font-size: 14px;
  color: #90a4c3;
}
.hint strong { color: var(--text); }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="badge"><span class="dot"></span> International Student Office</div>
    <h1>Welcome to Pepper</h1>
    <p>
      Tap the button below to start the session. If the screen touch is unreliable,
      you can also press Enter in the terminal or let Pepper detect your face.
    </p>
    <div class="actions">
      <button id="startButton" type="button" onclick="startSession()">Tap to Start</button>
    </div>
    <div class="hint" id="status">Ready when you are.</div>
  </section>
</main>
<script>
function startSession() {
  var button = document.getElementById('startButton');
  var status = document.getElementById('status');
  button.disabled = true;
  button.textContent = 'Starting...';
  status.textContent = 'Starting session...';

  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/touch?q=__start__', true);
  xhr.onload = function() {
    status.textContent = 'Session request sent.';
  };
  xhr.onerror = function() {
    status.textContent = 'Button sent a start request.';
  };
  xhr.send();
}
</script>
</body>
</html>
